name: Build Windows Desktop Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch in PixoInteractive/pegify to build'
        required: true
        default: 'v4/main'
        type: string
      release_tag:
        description: 'Release tag to attach installer'
        required: true
        default: 'v0.2.0-beta.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Clone private source repository
        env:
          SOURCE_TOKEN: ${{ secrets.PIXO_SOURCE_TOKEN }}
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.branch }} https://x-access-token:$SOURCE_TOKEN@github.com/PixoInteractive/pegify.git source
        shell: bash

      - name: Build Cockpit Web Assets
        run: |
          cd source/cockpit
          npm ci
          npm run build
          npm run verify:dist
        shell: bash

      - name: Compile Real Python Daemon Sidecar
        run: |
          cd source
          uv sync --all-extras
          uv pip install pyinstaller
          mkdir -p tauri-shell/src-tauri/binaries
          mkdir -p build/pyinstaller
          uv run pyinstaller \
            --name pegify-daemon \
            --onefile \
            --clean \
            --noconfirm \
            --collect-all pegify \
            --collect-all psycopg \
            --collect-all psycopg_binary \
            --add-data "src/pegify/core/workflows/templates;pegify/core/workflows/templates" \
            --add-data "src/pegify/core/skills;pegify/core/skills" \
            --add-data "src/pegify/core/foundation/skills;pegify/core/foundation/skills" \
            --add-data "src/pegify/daemon/adapters;pegify/daemon/adapters" \
            --add-data "src/pegify/workers/executors/data;pegify/workers/executors/data" \
            --add-data "plugin/skills;plugin/skills" \
            --distpath tauri-shell/src-tauri/binaries \
            --workpath build/pyinstaller \
            entry.py
          ./tauri-shell/src-tauri/binaries/pegify-daemon.exe --version
          python scripts/prepare_desktop_daemon.py
        shell: bash

      - name: Smoke Test Daemon Standby Mode
        shell: pwsh
        run: |
          cd source
          $env:PEGIFY_DESKTOP_APP = "1"
          $env:PEGIFY_HOME = Join-Path $env:RUNNER_TEMP "pegify_smoke_home"
          New-Item -ItemType Directory -Force -Path $env:PEGIFY_HOME | Out-Null
          
          $exe = ".\tauri-shell\src-tauri\binaries\pegify-daemon.exe"
          Write-Host "Starting daemon smoke test: $exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "daemon","start","--foreground","--http-port","7654","--reason","ci_smoke_test" -PassThru -NoNewWindow
          
          $success = $false
          try {
              for ($i = 0; $i -lt 30; $i++) {
                  Start-Sleep -Seconds 1
                  if ($proc.HasExited) {
                      Write-Error "Daemon process exited prematurely with code $($proc.ExitCode)"
                      exit 1
                  }
                  try {
                      $resp = Invoke-RestMethod -Uri "http://127.0.0.1:7654/v2/health" -TimeoutSec 2 -ErrorAction Stop
                      if ($resp.status -eq "ok") {
                          Write-Host "HEALTH OK: $($resp | ConvertTo-Json -Compress)"
                          $prov = Invoke-RestMethod -Uri "http://127.0.0.1:7654/v2/provisioning/status" -TimeoutSec 2 -ErrorAction Stop
                          Write-Host "PROVISIONING OK: $($prov | ConvertTo-Json -Compress)"
                          $success = $true
                          break
                      }
                  } catch {
                      # port not open yet
                  }
              }
              if (-not $success) {
                  Write-Error "Daemon failed to respond to /v2/health within 30 seconds"
                  exit 1
              }

              Write-Host "Testing automated PostgreSQL setup on Windows runner..."
              try {
                  $autoResp = Invoke-RestMethod -Uri "http://127.0.0.1:7654/v2/provisioning/auto-setup-db" -Method Post -TimeoutSec 180 -ErrorAction Stop
                  Write-Host "AUTO-SETUP RESPONSE: $($autoResp | ConvertTo-Json -Compress)"
                  if ($autoResp.ok -ne $true) {
                      Write-Error "PostgreSQL auto-setup returned ok=false: $($autoResp.error)"
                      exit 1
                  }
              } catch {
                  Write-Error "Failed to invoke /v2/provisioning/auto-setup-db: $_"
                  exit 1
              }

              $finalProv = Invoke-RestMethod -Uri "http://127.0.0.1:7654/v2/provisioning/status" -TimeoutSec 5 -ErrorAction Stop
              Write-Host "FINAL PROVISIONING STATUS: $($finalProv.database | ConvertTo-Json -Compress)"
              if ($finalProv.database.status -ne "connected") {
                  Write-Error "Database status is not 'connected' after auto-setup: $($finalProv.database.status)"
                  exit 1
              }
              Write-Host "SUCCESS: Zero-command PostgreSQL auto-setup verified on Windows runner."
          } finally {
              if ($proc -and -not $proc.HasExited) {
                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
              Get-Process -Name "pegify-daemon","postgres","pg_ctl" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              $global:LASTEXITCODE = 0
          }

      - name: Build Tauri Desktop Installer (NSIS)
        run: |
          cd source/tauri-shell
          npm ci
          npx @tauri-apps/cli build --config src-tauri/tauri.release.conf.json --bundles nsis
        shell: bash

      - name: Security & Leak Gate Verification
        run: |
          cd source
          python scripts/check_desktop_release_no_source.py tauri-shell/src-tauri/target/release/bundle/nsis
          echo "Security Gate Passed: No source code or sourcemaps leaked into installer bundle."
        shell: bash

      - name: Stage Windows Installer
        run: |
          $nsisExe = Get-ChildItem -Path source\tauri-shell\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $nsisExe) {
            Write-Error "No NSIS executable found in target directory"
            exit 1
          }
          Write-Host "Found installer: $($nsisExe.FullName) (Size: $($nsisExe.Length) bytes)"
          Copy-Item $nsisExe.FullName -Destination Pegify-Windows-x64-setup.exe
          Get-FileHash Pegify-Windows-x64-setup.exe -Algorithm SHA256 | Format-List
        shell: pwsh

      - name: Remove source code from runner
        run: |
          Get-Process -Name "pegify-daemon","postgres","pg_ctl" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue source
          if (Test-Path source) {
            Write-Host "Forcing cleanup of remaining source files..."
            cmd /c "rd /s /q source" 2>$null
          }
          if (Test-Path source) {
            Start-Sleep -Seconds 3
            cmd /c "rd /s /q source" 2>$null
          }
          if (Test-Path source) {
            Write-Error "Failed to remove source directory: source directory still exists"
            exit 1
          }
          Write-Host "Source directory successfully removed from runner."
          $global:LASTEXITCODE = 0
        shell: pwsh

      - name: Update Checksums and Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash Pegify-Windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Staged Windows Installer SHA256: $hash"
          gh release download ${{ github.event.inputs.release_tag }} -p checksums.txt --repo Pegify/pegify
          $lines = Get-Content checksums.txt
          $updated = @()
          $replaced = $false
          foreach ($line in $lines) {
            if ($line -match "Pegify-Windows-x64-setup.exe") {
              $updated += "$hash  Pegify-Windows-x64-setup.exe"
              $replaced = $true
            } else {
              $updated += $line
            }
          }
          if (-not $replaced) {
            $updated += "$hash  Pegify-Windows-x64-setup.exe"
          }
          $updated | Set-Content checksums.txt
          Write-Host "Updated checksums.txt content:"
          Get-Content checksums.txt
          gh release upload ${{ github.event.inputs.release_tag }} Pegify-Windows-x64-setup.exe checksums.txt --clobber --repo Pegify/pegify
        shell: pwsh

