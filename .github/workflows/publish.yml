name: Publish Registry

on:
  push:
    branches: [main]
    paths:
      - 'marketplace/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml cryptography
      - name: Sign manifests
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          for f in marketplace/packages/*/manifest.yaml; do
            python marketplace/scripts/sign_manifest.py "$f"
          done
      - run: python marketplace/scripts/build_index.py
      - name: Build skill archives
        run: |
          cd dist/v1/packages
          for dir in */; do
            name="${dir%/}"
            tar -czf "../${name}-latest.tar.gz" "$dir"
          done
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
